[package]
name = "rust-task-mgr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = "0.37.0"
egui = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.1", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "migrate"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1.29.3", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
