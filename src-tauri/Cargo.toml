[package]
name = "rust-task-mgr"
version = "0.1.0"
edition = "2024"

[lib]
name = "rust_task_mgr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "migrate"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0.0"
anyhow = "1.0"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.27.0"
